<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap');

#conv-root{
  font-family:'DM Sans',sans-serif;
  min-height:100vh;
  background:radial-gradient(circle at top,#141b3a,#0b1026 65%);
  color:#fff;
}

/* ───────── Header ───────── */
.conv-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  padding:2rem 2.5rem 1.2rem;
}

.conv-title{
  font-family:'Syne',sans-serif;
  font-size:clamp(2.2rem,5vw,3.2rem);
  font-weight:800;
  line-height:1;
}

.conv-sub{
  font-size:.75rem;
  letter-spacing:.18em;
  opacity:.65;
  margin-top:.35rem;
  text-transform:uppercase;
}

.conv-actions a{
  font-size:.8rem;
  font-weight:700;
  padding:.45rem .9rem;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.08);
  color:#fff;
  text-decoration:none;
}

/* ───────── Legend (bigger + no big color blocks) ───────── */
.conv-legend{
  max-width:1100px;
  margin:0 auto;
  padding:0 2.5rem 1.15rem;
  display:flex;
  gap:1rem;
  flex-wrap:wrap;
  align-items:center;
  opacity:.98;
}

.legend-pill{
  display:inline-flex;
  gap:.55rem;
  align-items:center;
  padding:.48rem .95rem;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.07);
  font-size:.92rem;
  font-weight:700;
}

.legend-dot{
  width:14px;height:14px;
  border-radius:50%;
  box-shadow:0 0 0 2px rgba(255,255,255,.10), 0 6px 14px rgba(0,0,0,.35);
}

/* Paleta apta per a daltonisme (evitam verd/vermell) i amb dos blaus ben diferenciats:
   - Pendent: porpra (NO blau)
   - Fet: ambre/taronja
   - Assolit: cian/blau
*/
.dot-default{ background:linear-gradient(145deg,#7c3aed,#a855f7); }
.dot-done{ background:linear-gradient(145deg,#f59e0b,#f97316); }
.dot-assolit{ background:linear-gradient(145deg,#06b6d4,#0ea5e9); }

/* ───────── Grid ───────── */
.conv-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:1.4rem;
  padding:1.15rem 2.5rem 3rem;
  max-width:1100px;
  margin:0 auto;
}

@media (max-width:900px){
  .conv-grid{ grid-template-columns:repeat(2,1fr); }
}
@media (max-width:520px){
  .conv-grid{ grid-template-columns:1fr; }
}

/* ───────── Cards (base stays nice, statuses don't recolor the whole card) ───────── */
.conv-card{
  position:relative;
  border-radius:20px;
  padding:1.6rem 1.5rem;
  min-height:160px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  text-decoration:none;
  color:#fff;
  /* base card is purple-ish to differ from 'assolit' cyan */
  background:linear-gradient(145deg,#7c3aed,#4f46e5);
  box-shadow:0 18px 45px rgba(0,0,0,.45);
  transition:transform .22s ease, box-shadow .22s ease, filter .22s ease;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.10);
}

.conv-card::after{
  content:'';
  position:absolute;
  top:-40px;
  right:-40px;
  width:120px;
  height:120px;
  border-radius:50%;
  background:rgba(255,255,255,.08);
}

.conv-card:hover{
  transform:translateY(-6px) scale(1.03);
  box-shadow:0 30px 70px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.12);
  filter:brightness(1.08);
}

/* Status styling WITHOUT changing full background (no big color boxes): ring + badge */
.conv-card.done{
  box-shadow:0 30px 70px rgba(0,0,0,.6), 0 0 0 2px rgba(245,158,11,.45);
}

.conv-card.assolit{
  box-shadow:0 30px 70px rgba(0,0,0,.6), 0 0 0 2px rgba(6,182,212,.55);
}

/* Data-attribute alternative */
.conv-card[data-status="fet"]{
  box-shadow:0 30px 70px rgba(0,0,0,.6), 0 0 0 2px rgba(245,158,11,.45);
}

.conv-card[data-status="assolit"]{
  box-shadow:0 30px 70px rgba(0,0,0,.6), 0 0 0 2px rgba(6,182,212,.55);
}

/* Badge with icon ✓ (optional, JS can insert it) */
.conv-badge{
  position:absolute;
  top:14px;
  left:14px;
  padding:.28rem .6rem;
  border-radius:999px;
  font-size:.72rem;
  letter-spacing:.10em;
  font-weight:900;
  text-transform:uppercase;
  background:rgba(0,0,0,.22);
  border:1px solid rgba(255,255,255,.18);
  backdrop-filter: blur(6px);
}

/* Auto icon ✓ without extra HTML (if you prefer): */
.conv-card.done::before,
.conv-card[data-status="fet"]::before{
  content:"✓";
  position:absolute;
  top:14px;
  right:14px;
  width:28px;
  height:28px;
  border-radius:999px;
  display:grid;
  place-items:center;
  font-weight:900;
  font-size:.9rem;
  background:rgba(0,0,0,.22);
  border:1px solid rgba(255,255,255,.18);
}

.conv-card.assolit::before,
.conv-card[data-status="assolit"]::before{
  content:"✓";
  position:absolute;
  top:14px;
  right:14px;
  width:28px;
  height:28px;
  border-radius:999px;
  display:grid;
  place-items:center;
  font-weight:900;
  font-size:.9rem;
  background:rgba(0,0,0,.22);
  border:1px solid rgba(255,255,255,.18);
}

/* ───────── Content ───────── */
.conv-label{
  font-size:.7rem;
  letter-spacing:.14em;
  opacity:.8;
  font-weight:800;
  color:rgba(224,231,255,.95);
}

.conv-name{
  font-family:'Syne',sans-serif;
  font-size:1.1rem;
  font-weight:800;
  line-height:1.25;
  color:#fff;
}

.conv-meta{ font-size:.78rem; opacity:.92; }
.conv-link{ font-size:.72rem; font-weight:800; opacity:.92; }
.conv-card:hover .conv-link{ opacity:1; }
</style>

<div id="conv-root">
  <header class="conv-header">
    <div>
      <div class="conv-title">Domini lingüístic · Àrea 2</div>
      <div class="conv-sub">Convocatòries oficials B2</div>
    </div>
    <div class="conv-actions">
      <a href="#/home">Inici</a>
    </div>
  </header>

  <!-- Llegenda més gran (sense caixes de color, només puntet) -->
  <div class="conv-legend">
    <span class="legend-pill"><span class="legend-dot dot-default"></span> Pendent</span>
    <span class="legend-pill"><span class="legend-dot dot-done"></span> Fet</span>
    <span class="legend-pill"><span class="legend-dot dot-assolit"></span> Assolit (≥60%)</span>
  </div>

  <!-- ⚠️ Aquest contenidor el continua omplint el JS existent -->
  <div id="convocatories" class="conv-grid"></div>

  <!--
    NOTES PER AL JS:
    - Marca estat amb class: done / assolit  (ex: class="conv-card done")
      o amb data-status: fet / assolit (ex: class="conv-card" data-status="fet")
    - No canvia el fons sencer: només posa un contorn (ring) + ✓ (via ::before)
    - Si prefereixes badge textual, insereix <div class="conv-badge">✓ Fet</div>
  -->
</div>
