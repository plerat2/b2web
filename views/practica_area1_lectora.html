<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap');

#l1-root{
  font-family:'DM Sans',sans-serif;
  min-height:100vh;
  background:radial-gradient(circle at top,#0f1c2e,#081427 65%);
  color:#fff;
}

/* Header */
.l1-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  padding:2rem 2.5rem 1.2rem;
}
.l1-title{
  font-family:'Syne',sans-serif;
  font-size:clamp(2.2rem,5vw,3.2rem);
  font-weight:800;
  line-height:1;
}
.l1-sub{
  font-size:.75rem;
  letter-spacing:.18em;
  opacity:.6;
  margin-top:.35rem;
  text-transform:uppercase;
}
.l1-actions a{
  font-size:.8rem;
  font-weight:700;
  padding:.45rem .9rem;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.08);
  color:#fff;
  text-decoration:none;
}

/* Llegenda (coherent amb Àrea 2) */
.l1-legend{
  max-width:1100px;
  margin:0 auto;
  padding:0 2.5rem 1.15rem;
  display:flex;
  gap:1rem;
  flex-wrap:wrap;
  align-items:center;
  opacity:.98;
}
.legend-pill{
  display:inline-flex;
  gap:.55rem;
  align-items:center;
  padding:.48rem .95rem;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.07);
  font-size:.92rem;
  font-weight:700;
}
.legend-dot{
  width:14px;height:14px;
  border-radius:50%;
  box-shadow:0 0 0 2px rgba(255,255,255,.10), 0 6px 14px rgba(0,0,0,.35);
}
.dot-default{ background:linear-gradient(145deg,#7c3aed,#a855f7); }
.dot-done{ background:linear-gradient(145deg,#f59e0b,#f97316); }
.dot-assolit{ background:linear-gradient(145deg,#06b6d4,#0ea5e9); }

/* Layout */
.l1-wrap{
  max-width:1100px;
  margin:0 auto;
  padding:0 2.5rem 3rem;
}

/* Grid de targetes */
#a1List{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:1.2rem;
}
@media (max-width:720px){
  #a1List{ grid-template-columns:1fr; }
}

/* Capçalera per convocatòria */
.l1-group{
  grid-column:1/-1;
  margin-top:1.2rem;
  margin-bottom:.2rem;
  font-size:1rem;
  font-weight:800;
  opacity:.9;
}

/* Targeta lectora (més color, to verd-teal) */
.l1-card{
  position:relative;
  display:block;
  border-radius:22px;
  padding:1.45rem 1.35rem;
  text-decoration:none;
  color:#fff;
  background:linear-gradient(145deg,#0f766e,#22c55e);
  box-shadow:0 18px 45px rgba(0,0,0,.45);
  border:1px solid rgba(255,255,255,.10);
  overflow:hidden;
  transition:transform .22s ease, box-shadow .22s ease, filter .22s ease;
}
.l1-card::after{
  content:'';
  position:absolute;
  top:-40px;
  right:-40px;
  width:120px;
  height:120px;
  border-radius:50%;
  background:rgba(255,255,255,.10);
}
.l1-card:hover{
  transform:translateY(-6px) scale(1.02);
  box-shadow:0 30px 70px rgba(0,0,0,.6);
  filter:brightness(1.05);
}

/* Estat (mateixos colors i lògica que Àrea 2) */
.l1-card[data-status="fet"]{
  outline:5px solid rgba(245,158,11,.95);
  outline-offset:4px;
}
.l1-card[data-status="assolit"]{
  outline:5px solid rgba(6,182,212,.95);
  outline-offset:4px;
}

/* ✓ */
.l1-card[data-status="fet"]::before,
.l1-card[data-status="assolit"]::before{
  content:"✓";
  position:absolute;
  top:12px;
  right:12px;
  width:34px;
  height:34px;
  border-radius:999px;
  display:grid;
  place-items:center;
  font-weight:900;
  font-size:1.05rem;
  background:rgba(0,0,0,.28);
  border:1px solid rgba(255,255,255,.22);
  box-shadow:0 10px 24px rgba(0,0,0,.35);
}

/* Contingut targeta */
.l1-card-title{ font-family:'Syne',sans-serif; font-size:1.12rem; font-weight:800; line-height:1.2; }
.l1-card-sub{ font-size:.8rem; opacity:.9; margin-top:.25rem; }
.l1-card-meta{ font-size:.82rem; opacity:.92; margin-top:.75rem; }
.l1-card-cta{ font-size:.78rem; font-weight:800; opacity:.92; margin-top:1rem; }

/* Visor */
#lectPdfViewer{ margin-top:2.2rem; }
</style>

<div id="l1-root">
  <header class="l1-header">
    <div>
      <div class="l1-title">Pràctica · Àrea 1 (Lectora)</div>
      <div class="l1-sub">Comprensió escrita</div>
    </div>
    <div class="l1-actions">
      <a href="#/practica">Enrere</a>
    </div>
  </header>

  <div class="l1-legend">
    <span class="legend-pill"><span class="legend-dot dot-default"></span> Pendent</span>
    <span class="legend-pill"><span class="legend-dot dot-done"></span> Fet</span>
    <span class="legend-pill"><span class="legend-dot dot-assolit"></span> Assolit (≥60%)</span>
  </div>

  <div class="l1-wrap">
    <section id="a1List"></section>
    <div id="lectPdfViewer"></div>
  </div>
</div>
