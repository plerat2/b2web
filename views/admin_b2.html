<style>
/* ───────── Base ───────── */
.admin-wrap {
  max-width: 1100px;
  margin: 0 auto;
}

.student-card {
  border: 1px solid rgba(255,255,255,.12);
  background: rgba(255,255,255,.06);
  border-radius: 18px;
  padding: 16px 18px;
}

.student-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
}

.student-email {
  font-weight: 800;

}

.student-meta {
  font-size: .8rem;

}

/* ───────── Badge base ───────── */
.badge-status {
  display: inline-flex;
  align-items: center;
  gap: .45rem;
  padding: .32rem .75rem;
  border-radius: 999px;
  font-size: .75rem;
  font-weight: 800;
  letter-spacing: .02em;
}

/* ✅ ASSOLIT (≥60%) — Blau */
.badge-ok {
  background: rgba(59,130,246,.22);       /* blue-500 */
  border: 1.5px solid rgba(59,130,246,.5);
  color: #bfdbfe;                         /* blue-200 */
}

/* ⚠️ A REFORÇAR (<60%) — Ambre més visible */
.badge-no {
  background: rgba(245,158,11,.3);        /* amber-500 */
  border: 2px solid rgba(245,158,11,.6);

  font-size: .8rem;                       /* una mica més gran */

}

.badge-neutral {

  color: rgba(255,255,255,.75);

}

/* ───────── Progress ───────── */
.progress {
  height: 10px;
  border-radius: 999px;
  background: rgba(255,255,255,.12);
  overflow: hidden;
  border: 1px solid rgba(255,255,255,.12);
}

.progress span {
  display: block;
  height: 100%;
  border-radius: 999px;
}

.progress.ok span {
  background: linear-gradient(
    135deg,
    rgba(59,130,246,.95),
    rgba(37,99,235,.9)
  );
}

.progress.no span {
  background: linear-gradient(
    135deg,
    rgba(245,158,11,.9),
    rgba(217,119,6,.85)
  );
}

/* ───────── Detall ───────── */
.student-detail {
  margin-top: 14px;
  padding-top: 12px;

}

.attempt-row {
  display: flex;
  justify-content: space-between;
  font-size: .8rem;
  padding: 6px 0;
  border-bottom: 1px dashed rgba(255,255,255,.08);
}

.attempt-row:last-child {
  border-bottom: none;
}

.attempt-ok {
  color: #93c5fd;
  font-weight: 700;
}

.attempt-no {
  color: #fde68a;
  font-weight: 700;
