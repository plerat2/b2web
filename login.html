<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inici de sessió · CATALÀ B2</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    body {
  font-family: 'Poppins', sans-serif;
  background: url('./img/background-b2.png') no-repeat center center fixed;
  background-size: cover;
  font-size: 18px;
  font-weight: 600;

  /* Millora de llegibilitat global */
  min-height: 100vh;
}

    .font-heading { font-weight: 800; }

    .glass-card {
      background: rgba(30, 41, 59, 0.47);
      backdrop-filter: blur(14px);
      border-radius: 22px;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center px-6">
  <div class="glass-card p-10 max-w-md w-full text-center text-white">
    <h1 class="text-4xl font-heading mb-2">CATALÀ B2</h1>
    <p class="mb-8 text-gray-200">Preparació del nivell B2 · CEPA Llevant</p>

    <form id="login-form" class="space-y-5">
      <div class="text-left">
        <label>Correu electrònic</label>
        <input type="email" id="email" required class="w-full mt-1 px-4 py-4 rounded-xl bg-gray-800 bg-opacity-50 border border-gray-600" />
      </div>

      <div class="text-left">
        <label>Contrasenya</label>
        <input type="password" id="password" required class="w-full mt-1 px-4 py-4 rounded-xl bg-gray-800 bg-opacity-50 border border-gray-600" />
      </div>

      <button type="submit" class="w-full py-4 text-xl rounded-xl font-bold bg-blue-600 hover:bg-blue-500">
        Inicia sessió
      </button>
    </form>

    <p class="text-gray-200 mt-8">Encara no tens compte? <a href="registre.html" class="underline">Registra't</a></p>
  </div>

  <script type="module" src="./js/auth_login.js"></script>
</body>
</html>
