<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registre · CATALÀ B2</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: url('./img/background-b2.png') no-repeat center center fixed;
      background-size: cover;
      font-size: 18px;
      font-weight: 600;
      min-height: 100vh;
    }
    .font-heading { font-weight: 800; }
    .glass-card {
      background: rgba(30, 41, 59, 0.47);
      backdrop-filter: blur(14px);
      border-radius: 22px;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center px-6">
  <div class="glass-card p-10 max-w-md w-full text-center text-white">
    <h1 class="text-4xl font-heading mb-2">CATALÀ B2</h1>
    <p class="mb-8 text-gray-200">Crea el teu compte de preparació B2</p>

    <form id="signup-form" class="space-y-5">
      <div class="text-left">
        <label class="block">Nom i llinatges</label>
        <input id="displayName" name="displayName" type="text" required
          placeholder="Nom i llinatges"
          class="w-full mt-1 px-4 py-4 rounded-xl bg-gray-800 bg-opacity-50 border border-gray-600" />
      </div>

      <div class="text-left">
        <label class="block">Correu electrònic</label>
        <input id="email" name="email" type="email" required
          placeholder="Correu electrònic"
          class="w-full mt-1 px-4 py-4 rounded-xl bg-gray-800 bg-opacity-50 border border-gray-600" />
      </div>

      <div class="text-left">
        <label class="block">Contrasenya</label>
        <input id="password" name="password" type="password" required
          placeholder="Contrasenya"
          class="w-full mt-1 px-4 py-4 rounded-xl bg-gray-800 bg-opacity-50 border border-gray-600" />
      </div>

      <div class="text-left">
        <label class="block">Repeteix la contrasenya</label>
        <input id="password2" name="password2" type="password" required
          placeholder="Repeteix la contrasenya"
          class="w-full mt-1 px-4 py-4 rounded-xl bg-gray-800 bg-opacity-50 border border-gray-600" />
      </div>

      <button type="submit" class="w-full py-4 text-xl rounded-xl font-bold bg-green-600 hover:bg-green-500">
        Crear compte
      </button>

      <!-- Missatge d'error (necessari per auth_signup.js) -->
      <div id="signup-error" class="hidden mt-2 text-sm text-red-100 bg-red-500/20 border border-red-300/30 rounded-xl p-3"></div>
    </form>

    <p class="text-gray-200 mt-8">Ja tens compte? <a href="login.html" class="underline">Inicia sessió</a></p>
  </div>

  <script type="module" src="./js/auth_signup.js"></script>
</body>
</html>
